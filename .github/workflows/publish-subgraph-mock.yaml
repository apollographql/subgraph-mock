name: Publish Subgraph Mock

on:
  push:
    branches:
      - main
      - test

env:
  REGISTRY: ghcr.io

jobs:
  publish-subgraph-mock-image:
    uses: apollographql/release-tooling/.github/workflows/build_and_publish.yml@cc8018036a3df0bfb7dd8b5d92ff23c998a59579
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      context: ${{ github.workspace }}
      dockerfile_location: ${{ github.workspace }}/Dockerfile
      image_description: 'An image that allows us to mock subgraphs for testing purposes'
      image_name: 'subgraph-mock'
      platforms: '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"},{"platform":"macOS/arm64","runner":"macos-26"}]'
    secrets: inherit
