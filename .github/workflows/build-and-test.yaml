name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  read-rust-version:
    name: Read Rust version from mise.toml
    runs-on: ubuntu-latest
    outputs:
      rust-version: ${{ steps.get-version.outputs.rust-version }}
      cargo-deny-version: ${{ steps.get-cargo-deny-version.outputs.cargo-deny-version }}
      typos-version: ${{ steps.get-typos-version.outputs.typos-version }}
      dprint-version: ${{ steps.get-dprint-version.outputs.dprint-version }}
    steps:
      - uses: actions/checkout@v4
      - id: get-version
        run: |
          version=$(grep '^rust\s*=' .config/mise/mise.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "rust-version=$version" >> "$GITHUB_OUTPUT"
      - id: get-cargo-deny-version
        run: |
          version=$(grep '"cargo:cargo-deny"' .config/mise/mise.toml | sed -E 's/.*= "([^"]+)"/\1/')
          echo "cargo-deny-version=$version" >> "$GITHUB_OUTPUT"
      - id: get-typos-version
        run: |
          version=$(grep '"cargo:typos-cli"' .config/mise/mise.toml | sed -E 's/.*= "([^"]+)"/\1/')
          echo "typos-version=$version" >> "$GITHUB_OUTPUT"
      - id: get-dprint-version
        run: |
          version=$(grep '"cargo:dprint"' .config/mise/mise.toml | sed -E 's/.*= "([^"]+)"/\1/')
          echo "dprint-version=$version" >> "$GITHUB_OUTPUT"

  check-for-updated-rust-files:
    name: Check whether rust files have been updated
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.check-changes.outputs.should_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Check for changes in relevant directories and files
      id: check-changes
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          # Check if any rust source code, Cargo.toml or Cargo.lock were changed
          git diff --name-only HEAD^ HEAD | grep -q -E "^(src/|tests/)|^Cargo\.toml$|^Cargo\.lock$" && echo "should_run=true" >> $GITHUB_OUTPUT || echo "should_run=false" >> $GITHUB_OUTPUT
        fi

  test-stable:
    name: Test Rust stable
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - name: Run tests
      run: cargo test --verbose

  rustfmt:
    name: Ensure rustfmt is happy
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        components: rustfmt
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - run: cargo pr-format

  clippy:
    name: Lint the codebase with clippy
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        components: clippy
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - run: cargo pr-clippy

  rustdoc:
    name: Check that rustdoc is happy
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: nightly
    - run: RUSTDOCFLAGS="-D warnings -D rustdoc::broken-intra-doc-links" cargo doc --all-features --workspace --no-deps
  
  cargo-deny:
    name: Check licenses, advisories, bans and sources with cargo-deny
    runs-on: ubuntu-latest
    needs: [read-rust-version]
    steps:
    - uses: actions/checkout@v4
      # The marketplace action can't be pinned to the version in mise.toml, so
      # install the binary directly instead, same as we do for dprint below
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tools]
          "aqua:EmbarkStudios/cargo-deny" = "${{ needs.read-rust-version.outputs.cargo-deny-version }}"
    - run: cargo-deny check

  spell-check:
    name: Spell check using the typos-cli crate
    runs-on: ubuntu-latest
    needs: [read-rust-version]
    steps:
    - uses: actions/checkout@v4
      # The marketplace action can't be pinned to the version in mise.toml, so
      # install the binary directly instead, same as we do for dprint below
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tools]
          "aqua:crate-ci/typos" = "${{ needs.read-rust-version.outputs.typos-version }}"
    - run: typos --config ./.typos.toml

  lint-markdown:
    name: Lint Markdown files with dprint
    runs-on: ubuntu-latest
    needs: [read-rust-version]
    steps:
    - uses: actions/checkout@v4
      # The action takes too long to build if we install all the tools in the repo
      # This deletes the full mise.toml and instead installs dprint only
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tools]
          "dprint" = "${{ needs.read-rust-version.outputs.dprint-version }}"
    - run: dprint check
