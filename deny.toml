# cargo-deny configuration.
# See https://embarkstudios.github.io/cargo-deny/ for documentation.

[graph]
all-features = true

[advisories]
ignore = [
    # tikv-jemalloc-ctl (jemalloc allocator metrics, see State::with_jemalloc_metrics) depends
    # on the unmaintained `paste` crate for its stats-MIB codegen macros. No newer
    # tikv-jemalloc-ctl release drops it, and there's no safe upgrade for `paste` itself.
    "RUSTSEC-2024-0436",
    # apollo-configuration still depends on serde_yaml even though we have removed our direct
    # dependency on it here. Once that is updated we can remove this ignore.
    "RUSTSEC-2024-0449"
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib"
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
