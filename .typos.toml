[files]
# Ignore GraphQL schema files that contain generated content and API names
# that may appear as typos but are intentional
extend-exclude = [
    "tests/data/*.graphql"
]

[default]
# W3C trace/span IDs (e.g. traceparent hex identifiers used in otel test
# fixtures) get false-positive flagged when typos' word-splitter extracts
# a dictionary-adjacent substring (e.g. "ba" out of "00f067aa0ba902b7").
extend-ignore-re = [
    "[0-9a-f]{16,32}"
]
