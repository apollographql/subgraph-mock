[tasks.fix-spelling]
run = "typos --write-changes"

[tasks.format-markdown]
run = "dprint fmt"
# Mise uses this config file location as its CWD
dir = "../../"

[tasks.pr-all]
run = [
    "mise run pr-format",
    "mise run pr-clippy",
    "mise run pr-rustdoc",
    "mise run pr-spell-check",
    "mise run pr-markdown",
    "mise run pr-test",
    "mise run pr-deny"
]

[tasks.pr-clippy]
run = "cargo pr-clippy"

[tasks.pr-deny]
run = "cargo deny check"

[tasks.pr-rustdoc]
run = "RUSTDOCFLAGS=\"-D warnings -D rustdoc::broken-intra-doc-links\" cargo doc --all-features --workspace --no-deps"

[tasks.pr-format]
run = "cargo pr-format"

[tasks.pr-markdown]
run = "dprint check"
# Mise uses this config file location as its CWD
dir = "../../"

[tasks.pr-spell-check]
run = "typos"

[tasks.pr-test]
run = "cargo test"

[tools]
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-expand" = "1.0.116"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:typos-cli" = "1.34.0"
"cargo:dprint" = "0.56.0"
mdbook = "0.4.51"
rust = "1.97.1"
