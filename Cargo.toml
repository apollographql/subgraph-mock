[package]
authors = ["Apollo Developers <opensource@apollographql.com>"]
categories = ["development-tools::testing", "web-programming::http-server"]
description = """
A standalone mock subgraph server designed to be placed behind a supergraph for testing.
"""
documentation = "https://docs.rs/subgraph-mock"
edition = "2024"
keywords = ["graphql", "mock-server", "apollo"]
license = "MIT"
name = "subgraph-mock"
readme = "README.md"
repository = "https://github.com/apollographql/subgraph-mock"
version = "0.2.1"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["macros", "net", "parking_lot", "rt-multi-thread", "signal"] }

[dependencies]
anyhow = "1.0.104"
apollo-compiler = "1.32.0"
apollo-configuration = { version = "0.5.0", default-features = false, features = ["duration", "http"] }
apollo-errors = "0.8.0"
apollo-healthcheck = "0.3.0"
apollo-http-server-telemetry = "0.3.0"
apollo-opentelemetry = { version = "0.10.0", default-features = false, features = ["otlp", "tower"] }
apollo-smith = "0.16.0"
base64 = "0.22"
cached = { version = "0.59.0", features = ["async", "async_tokio_rt_multi_thread"] }
clap = { version = "4.5.47", features = ["derive"] }
http = "1.5.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["server"] }
hyper-util = { version = "0.1.16", features = ["server-auto", "server-graceful", "tokio", "service"] }
indexmap = "2.0"
miette = "7.6.0"
notify = "8.0"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
ordered-float = { version = "5.0", features = ["serde"] }
prost = "0.13"
prost-types = "0.13"
rand = "0.10.0"
schemars = "1.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json_bytes = "0.2.5"
serde_yaml = "0.9.34"
tokio = { workspace = true }
tower = "0.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# glibc malloc (prod runtime is debian/trixie-slim, see Dockerfile) does not return freed pages
# to the OS after allocation spikes, so RSS sticks at peak. jemalloc's background threads purge
# dirty pages on a decay timer. Linux-only so local (macOS) dev builds keep the system allocator
# and gain no C-build dependency.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

# TODO: drop this patch once apollo-rs#1081 (ResponseBuilder::with_partial_data) is released
[patch.crates-io]
apollo-smith = { git = "https://github.com/apollographql/apollo-rs", branch = "tninesling/smith-partial-data" }
apollo-compiler = { git = "https://github.com/apollographql/apollo-rs", branch = "tninesling/smith-partial-data" }
apollo-parser = { git = "https://github.com/apollographql/apollo-rs", branch = "tninesling/smith-partial-data" }

[dev-dependencies]
apollo-parser = "0.8.5"
arbitrary = "1.4.2"
futures = "0.3.31"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
pretty_assertions = "1.4"
tokio = { workspace = true , features = ["test-util"] }
