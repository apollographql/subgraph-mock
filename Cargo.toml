[package]
authors = ["Apollo Developers <opensource@apollographql.com>"]
categories = ["development-tools::testing", "web-programming::http-server"]
description = """
A standalone mock subgraph server designed to be placed behind a supergraph for testing.
"""
documentation = "https://docs.rs/subgraph-mock"
edition = "2024"
keywords = ["graphql", "mock-server", "apollo"]
license = "MIT"
name = "subgraph-mock"
readme = "README.md"
repository = "https://github.com/apollographql/subgraph-mock"
version = "0.2.1"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["macros", "net", "parking_lot", "rt-multi-thread", "signal"] }

[dependencies]
anyhow = "1.0.104"
apollo-compiler = "2.0.0-beta.1"
apollo-configuration = { version = "0.10.0", default-features = false, features = ["duration", "http"] }
apollo-errors = "0.8.1"
apollo-healthcheck = "0.5.6"
apollo-http-server-telemetry = "0.4.6"
apollo-opentelemetry = { version = "0.12.4", default-features = false, features = ["otlp", "tower"] }
apollo-smith = "0.17.0-beta.1"
base64 = "0.23"
cached = { version = "4.0.3", features = ["async"] }
clap = { version = "4.6.7", features = ["derive"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "tokio", "service"] }
indexmap = "2.14"
miette = "7.6.0"
notify = "8.2"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
ordered-float = { version = "5.5", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.10.3"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json_bytes = "0.2.6"
serde_yaml = "0.9.34"
tokio = { workspace = true }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# glibc malloc (prod runtime is debian/trixie-slim, see Dockerfile) does not return freed pages
# to the OS after allocation spikes, so RSS sticks at peak. jemalloc's background threads purge
# dirty pages on a decay timer. Linux-only so local (macOS) dev builds keep the system allocator
# and gain no C-build dependency.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

[dev-dependencies]
apollo-parser = "0.9.0-beta.0"
arbitrary = "1.5.0"
futures = "0.3.34"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
pretty_assertions = "1.4"
tokio = { workspace = true , features = ["test-util"] }
