services:
  router:
    image: ${ROUTER_IMAGE}:${ROUTER_TAG}
    labels:
      rtf.io/file-providers: true
      rtf.io/log-collection: true
    container_name: router
    environment:
      APOLLO_KEY: "MOCK_APOLLO_KEY"
      APOLLO_GRAPH_REF: "mock@ref"
      APOLLO_USAGE_REPORTING_INGRESS_URL: http://mock-studio:1234/studio
    ports:
      - "4000:4000"
      - "9090:9090"
      - "8089:8089"
    # The entrypoint in the Docker image is /dist/router_wrapper.sh
    # We provide arguments directly, and use bash parameter expansion to handle the optional license
    # telemetry.apollo (usage reporting + tracing) only activates with a real graph identity: an
    # offline license lets the router validate that identity locally instead of calling Apollo's
    # live uplink, which would reject the placeholder APOLLO_KEY above outright.
    command: >
      -s ${SUPERGRAPH_SCHEMA} -c ${ROUTER_CONFIG} --hot-reload --license ${LICENSE_FILE:-/dev/null}
    restart: unless-stopped

  mock-studio:
    container_name: mock-studio
    image: us-central1-docker.pkg.dev/platform-cross-environment/apollo-private-docker/mock-studio:edge
    # :edge is a moving tag - without this, `docker compose up` reuses whatever copy is
    # already cached locally instead of checking for a newer push.
    pull_policy: always
    labels:
      rtf.io/log-collection: true
    restart: unless-stopped
    ports:
      - "1234:1234"

  subgraph:
    image: ${SUBGRAPH_IMAGE}
    labels:
      rtf.io/file-providers: true
      rtf.io/log-collection: true
      rtf.io/otel: true
    container_name: subgraph-mock
    command:
      - --schema
      - ${SUPERGRAPH_SCHEMA}
      - --config
      - ${SUBGRAPH_CONFIG_FILE}
    expose:
      - "8080"
    restart: unless-stopped
